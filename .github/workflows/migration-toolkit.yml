name: Migration research toolkit

on:
  pull_request:
  push:
    branches: [main, 'research/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:all
      - run: python -m unittest discover -s tools/migration/test -p 'test_*.py'
      - name: Verify optional native collector imports
        run: |
          python -m pip install -r tools/migration/requirements-ble.txt
          python -c "from bleak import BleakClient, BleakScanner"
          python tools/migration/ble_inventory.py --help

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run migration:build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/migration/test/browser_smoke.py
